# Optional Windows Server V1 data-path add-on. Install the normal Longhorn
# chart first, configured with the same coordinated multi-platform manager,
# engine, and instance-manager image references used below. Replace every
# :windows-v1-dev reference with the corresponding published OCI image index;
# do not combine a Windows-only engine tag with a different Linux engine tag.
# The public-fork workflows publish coordinated release-set references as
# ghcr.io/<owner>/{longhorn-manager,longhorn-engine,longhorn-instance-manager,
# csi-proxy}:<shared-tag>. Engine upgrade tests use a second, immutable engine
# tag rather than repointing the first tag.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: longhorn-manager-windows
  namespace: longhorn-system
  labels:
    app: longhorn-manager
    longhorn.io/operating-system: windows
spec:
  selector:
    matchLabels:
      app: longhorn-manager
      longhorn.io/operating-system: windows
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 100%
  template:
    metadata:
      labels:
        app: longhorn-manager
        longhorn.io/operating-system: windows
    spec:
      serviceAccountName: longhorn-service-account
      hostNetwork: true
      nodeSelector:
        kubernetes.io/os: windows
      tolerations:
        - key: node.kubernetes.io/os
          operator: Exists
          effect: NoSchedule
      priorityClassName: longhorn-critical
      securityContext:
        windowsOptions:
          hostProcess: true
          runAsUserName: NT AUTHORITY\SYSTEM
      containers:
        - name: longhorn-manager
          image: longhornio/longhorn-manager:windows-v1-dev
          imagePullPolicy: IfNotPresent
          command:
            - C:\usr\local\bin\longhorn-manager.exe
          args:
            - -d
            - daemon
            - --engine-image
            - longhornio/longhorn-engine:windows-v1-dev
            - --instance-manager-image
            - longhornio/longhorn-instance-manager:windows-v1-dev
            - --share-manager-image
            - longhornio/longhorn-share-manager:v1.12.0
            - --backing-image-manager-image
            - longhornio/backing-image-manager:v1.12.0
            - --support-bundle-manager-image
            - longhornio/support-bundle-kit:v0.0.86
            - --manager-image
            - longhornio/longhorn-manager:windows-v1-dev
            - --service-account
            - longhorn-service-account
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: LONGHORN_DISTRO
              value: longhorn
          ports:
            - containerPort: 9500
              name: manager
            - containerPort: 9502
              name: admission-wh
            - containerPort: 9503
              name: recov-backend
          readinessProbe:
            httpGet:
              path: /v1/healthz
              port: 9502
              scheme: HTTPS
          volumeMounts:
            - name: longhorn
              mountPath: C:\var\lib\longhorn
            - name: longhorn-grpc-tls
              mountPath: C:\tls-files
              readOnly: true
      volumes:
        - name: longhorn
          hostPath:
            path: C:\var\lib\longhorn
            type: DirectoryOrCreate
        - name: longhorn-grpc-tls
          secret:
            secretName: longhorn-grpc-tls
            optional: true
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: longhorn-csi-proxy-windows
  namespace: longhorn-system
  labels:
    app: longhorn-csi-proxy-windows
spec:
  selector:
    matchLabels:
      app: longhorn-csi-proxy-windows
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: longhorn-csi-proxy-windows
    spec:
      hostNetwork: true
      nodeSelector:
        kubernetes.io/os: windows
      tolerations:
        - key: node.kubernetes.io/os
          operator: Exists
          effect: NoSchedule
      securityContext:
        windowsOptions:
          hostProcess: true
          runAsUserName: NT AUTHORITY\SYSTEM
      containers:
        - name: csi-proxy
          image: longhornio/csi-proxy:windows-v1-dev
          imagePullPolicy: IfNotPresent
          command:
            - C:\usr\local\bin\csi-proxy.exe
          args:
            - -kubelet-path=C:\var\lib\kubelet
            - -working-dir=C:\var\lib\longhorn
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: longhorn-csi-plugin-windows
  namespace: longhorn-system
  labels:
    app: longhorn-csi-plugin-windows
spec:
  selector:
    matchLabels:
      app: longhorn-csi-plugin-windows
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: longhorn-csi-plugin-windows
    spec:
      serviceAccountName: longhorn-service-account
      hostNetwork: true
      nodeSelector:
        kubernetes.io/os: windows
      tolerations:
        - key: node.kubernetes.io/os
          operator: Exists
          effect: NoSchedule
      securityContext:
        windowsOptions:
          hostProcess: true
          runAsUserName: NT AUTHORITY\SYSTEM
      containers:
        - name: node-driver-registrar
          image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.16.0
          imagePullPolicy: IfNotPresent
          command:
            - csi-node-driver-registrar.exe
          args:
            - --v=2
            - --csi-address=$(CSI_ENDPOINT)
            - --kubelet-registration-path=$(DRIVER_REG_SOCK_PATH)
            - --plugin-registration-path=$(PLUGIN_REG_DIR)
          env:
            - name: CSI_ENDPOINT
              value: unix://C:\var\lib\kubelet\plugins\driver.longhorn.io\csi.sock
            - name: DRIVER_REG_SOCK_PATH
              value: C:\var\lib\kubelet\plugins\driver.longhorn.io\csi.sock
            - name: PLUGIN_REG_DIR
              value: C:\var\lib\kubelet\plugins_registry\
            - name: KUBE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
        - name: longhorn-csi-plugin
          image: longhornio/longhorn-manager:windows-v1-dev
          imagePullPolicy: IfNotPresent
          command:
            - C:\usr\local\bin\longhorn-windows-csi.exe
          args:
            - --driver-name=driver.longhorn.io
            - --version=windows-v1-dev
            - --node-id=$(KUBE_NODE_NAME)
            - --manager-url=http://longhorn-backend:9500/v1
            - --endpoint=$(CSI_ENDPOINT)
          env:
            - name: CSI_ENDPOINT
              value: unix://C:\var\lib\kubelet\plugins\driver.longhorn.io\csi.sock
            - name: KUBE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
