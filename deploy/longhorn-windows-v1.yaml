# Optional Windows Server V1 data-path add-on. Install the normal Longhorn
# chart first, configured with the same coordinated multi-platform manager,
# engine, and instance-manager image references pinned below. Do not combine a
# Windows-only engine tag with a different Linux engine tag. The public-fork
# workflows publish each platform on its matching runner, then assemble these
# coordinated OCI indexes. Engine upgrade tests use a second, immutable engine
# tag rather than repointing this release-set tag.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: longhorn-windows-engine-image-capability-probe
rules:
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: longhorn-windows-engine-image-capability-probe
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: longhorn-windows-engine-image-capability-probe
subjects:
  - kind: ServiceAccount
    name: longhorn-service-account
    namespace: longhorn-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: longhorn-manager-windows
  namespace: longhorn-system
  labels:
    app: longhorn-manager
    longhorn.io/operating-system: windows
spec:
  selector:
    matchLabels:
      app: longhorn-manager
      longhorn.io/operating-system: windows
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 100%
  template:
    metadata:
      labels:
        app: longhorn-manager
        longhorn.io/operating-system: windows
    spec:
      serviceAccountName: longhorn-service-account
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/os: windows
      tolerations:
        - key: node.kubernetes.io/os
          operator: Exists
          effect: NoSchedule
      priorityClassName: longhorn-critical
      securityContext:
        windowsOptions:
          hostProcess: true
          runAsUserName: NT AUTHORITY\SYSTEM
      containers:
        - name: longhorn-manager
          image: ghcr.io/appmana/longhorn-manager:windows-v1-20260717.8
          imagePullPolicy: IfNotPresent
          securityContext:
            windowsOptions:
              hostProcess: true
              runAsUserName: NT AUTHORITY\SYSTEM
          command:
            - C:\Windows\System32\cmd.exe
            - /S
            - /C
          args:
            - '%CONTAINER_SANDBOX_MOUNT_POINT%\usr\local\bin\longhorn-manager.exe'
            - -d
            - daemon
            - --engine-image
            - ghcr.io/appmana/longhorn-engine:windows-v1-20260717.5
            - --instance-manager-image
            - ghcr.io/appmana/longhorn-instance-manager:windows-v1-20260717.6
            - --share-manager-image
            - longhornio/longhorn-share-manager:v1.12.0
            - --backing-image-manager-image
            - longhornio/backing-image-manager:v1.12.0
            - --support-bundle-manager-image
            - longhornio/support-bundle-kit:v0.0.86
            - --manager-image
            - ghcr.io/appmana/longhorn-manager:windows-v1-20260717.8
            - --service-account
            - longhorn-service-account
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: LONGHORN_DISTRO
              value: longhorn
          ports:
            - containerPort: 9500
              name: manager
            - containerPort: 9502
              name: admission-wh
            - containerPort: 9503
              name: recov-backend
          readinessProbe:
            httpGet:
              path: /v1
              port: 9500
              scheme: HTTP
            timeoutSeconds: 5
          volumeMounts:
            - name: longhorn
              mountPath: C:\var\lib\longhorn
            - name: longhorn-grpc-tls
              mountPath: C:\tls-files
              readOnly: true
      volumes:
        - name: longhorn
          hostPath:
            path: C:\var\lib\longhorn
            type: DirectoryOrCreate
        - name: longhorn-grpc-tls
          secret:
            secretName: longhorn-grpc-tls
            optional: true
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: longhorn-csi-proxy-windows
  namespace: longhorn-system
  labels:
    app: longhorn-csi-proxy-windows
spec:
  selector:
    matchLabels:
      app: longhorn-csi-proxy-windows
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: longhorn-csi-proxy-windows
    spec:
      hostNetwork: true
      nodeSelector:
        kubernetes.io/os: windows
      tolerations:
        - key: node.kubernetes.io/os
          operator: Exists
          effect: NoSchedule
      securityContext:
        windowsOptions:
          hostProcess: true
          runAsUserName: NT AUTHORITY\SYSTEM
      containers:
        - name: csi-proxy
          image: ghcr.io/appmana/csi-proxy:windows-v1-20260717.9
          imagePullPolicy: IfNotPresent
          securityContext:
            windowsOptions:
              hostProcess: true
              runAsUserName: NT AUTHORITY\SYSTEM
          command:
            - C:\Windows\System32\cmd.exe
            - /S
            - /C
          args:
            - '%CONTAINER_SANDBOX_MOUNT_POINT%\usr\local\bin\csi-proxy.exe'
            - -kubelet-path=C:\var\lib\kubelet
            - -working-dir=C:\var\lib\longhorn
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: longhorn-csi-plugin-windows
  namespace: longhorn-system
  labels:
    app: longhorn-csi-plugin-windows
spec:
  selector:
    matchLabels:
      app: longhorn-csi-plugin-windows
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: longhorn-csi-plugin-windows
    spec:
      serviceAccountName: longhorn-service-account
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/os: windows
      tolerations:
        - key: node.kubernetes.io/os
          operator: Exists
          effect: NoSchedule
      securityContext:
        windowsOptions:
          hostProcess: true
          runAsUserName: NT AUTHORITY\SYSTEM
      containers:
        - name: node-driver-registrar
          image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.16.0
          imagePullPolicy: IfNotPresent
          securityContext:
            windowsOptions:
              hostProcess: true
              runAsUserName: NT AUTHORITY\SYSTEM
          command:
            - C:\Windows\System32\cmd.exe
            - /S
            - /C
          args:
            # HostProcess image files live below the sandbox root on both
            # containerd 1.x and 2.x. The image PATH intentionally contains
            # Windows system directories only.
            - '%CONTAINER_SANDBOX_MOUNT_POINT%\csi-node-driver-registrar.exe'
            - --v=2
            - --csi-address=$(CSI_ENDPOINT)
            - --kubelet-registration-path=$(DRIVER_REG_SOCK_PATH)
            - --plugin-registration-path=$(PLUGIN_REG_DIR)
          env:
            - name: CSI_ENDPOINT
              value: unix://C:\var\lib\kubelet\plugins\driver.longhorn.io\csi.sock
            - name: DRIVER_REG_SOCK_PATH
              value: C:\var\lib\kubelet\plugins\driver.longhorn.io\csi.sock
            - name: PLUGIN_REG_DIR
              value: C:\var\lib\kubelet\plugins_registry\
            - name: KUBE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
        - name: longhorn-csi-plugin
          image: ghcr.io/appmana/longhorn-manager:windows-v1-20260717.8
          imagePullPolicy: IfNotPresent
          securityContext:
            windowsOptions:
              hostProcess: true
              runAsUserName: NT AUTHORITY\SYSTEM
          command:
            - C:\Windows\System32\cmd.exe
            - /S
            - /C
          args:
            - '%CONTAINER_SANDBOX_MOUNT_POINT%\usr\local\bin\longhorn-windows-csi.exe'
            - --driver-name=driver.longhorn.io
            - --version=windows-v1-20260717.8
            - --node-id=$(KUBE_NODE_NAME)
            # Each Windows node has a local host-network manager. Use the node
            # data address without coupling CSI startup to overlay Service VIPs.
            - --manager-url=http://$(NODE_IP):9500/v1
            - --endpoint=$(CSI_ENDPOINT)
          env:
            - name: CSI_ENDPOINT
              value: unix://C:\var\lib\kubelet\plugins\driver.longhorn.io\csi.sock
            - name: KUBE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
---
# Expose the standard OS label through CSI topology before a delayed-binding
# Windows PVC selects a node. Linux CSI nodes already source this key from the
# Kubernetes Node object; the Windows HostProcess service reports "windows".
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: csi-allowed-topology-keys
  namespace: longhorn-system
value: kubernetes.io/os
---
# The stock system-managed DaemonSets contain Linux commands and host paths.
# Windows peers are created separately by the Windows-aware controllers above,
# so keep the stock DaemonSets Linux-only in every mixed-OS cluster.
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: system-managed-components-node-selector
  namespace: longhorn-system
value: kubernetes.io/os:linux
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-windows-ntfs
provisioner: driver.longhorn.io
allowVolumeExpansion: false
volumeBindingMode: WaitForFirstConsumer
parameters:
  dataEngine: v1
  dataLocality: best-effort
  fsType: ntfs
  numberOfReplicas: "3"
allowedTopologies:
  - matchLabelExpressions:
      - key: kubernetes.io/os
        values: [windows]
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-windows-refs
provisioner: driver.longhorn.io
allowVolumeExpansion: false
volumeBindingMode: WaitForFirstConsumer
parameters:
  dataEngine: v1
  dataLocality: best-effort
  fsType: refs
  numberOfReplicas: "3"
allowedTopologies:
  - matchLabelExpressions:
      - key: kubernetes.io/os
        values: [windows]
